[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cjge-word-toolkit"
version = "1.0.0"
description = "Word MCP server (Office-Word-MCP-Server fork) + docx-editor-cn skill, formatting documents in the Chinese Journal of Geotechnical Engineering (CJGE) layout"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "GongRzhe", email = "gongrzhe@gmail.com"},
    {name = "xyj0727"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "fastmcp>=2.8.1",
    "msoffcrypto-tool>=5.4.2",
    "docx2pdf>=0.1.8",
    "pytest>=8.4.2",
]

[project.urls]
"Homepage" = "https://github.com/xyj0727/cjge-word-toolkit"
"Bug Tracker" = "https://github.com/xyj0727/cjge-word-toolkit/issues"
"Upstream" = "https://github.com/GongRzhe/Office-Word-MCP-Server"

[tool.hatch.build.targets.wheel]
only-include = [
    "word_document_server",
    "office_word_mcp_server",
]
sources = ["."]

[project.scripts]
word_mcp_server = "word_document_server.main:run_server"
